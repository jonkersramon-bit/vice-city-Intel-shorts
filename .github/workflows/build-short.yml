name: Build Vice City Intel Short
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic (optional)"
        required: false
        default: "GTA 6 Unwanted Attention: Sneak Into the Impound"
      script:
        description: "English narration (optional)"
        required: false
        default: "Stuck on Unwanted Attention in GTA 6? Do not rush the impound gate. Go around the right side of the building and use the scissor lift to reach the roof. Find the Phoenix and scan it with your phone to update the objective. Then sneak down, hotwire the car, and make your escape. Follow Vice City Intel for more mission guides."
permissions:
  contents: read
jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check edge-tts pillow
      - name: Validate Python script
        run: python -m py_compile make_short.py
      - name: Check authorized gameplay source
        run: |
          mkdir -p assets output
          if [ ! -s assets/gameplay.mp4 ]; then
            echo "::error::No gameplay file found at assets/gameplay.mp4. YouTube blocks GitHub's automated downloads. Add an authorized gameplay MP4 to the repository; the workflow will use it automatically."
            exit 1
          fi
          printf '%s\n' 'Gameplay: @JasonsVideoGamesSource (only when this is the actual licensed source)' > output/GAMEPLAY_CREDIT.txt
      - name: Generate narration and video
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          SHORT_SCRIPT: ${{ inputs.script }}
        run: python make_short.py
      - name: Verify MP4 and subtitles
        run: |
          test -s output/vice_city_intel.mp4
          test -s output/captions.ass
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q audio
          python -c "from pathlib import Path; s=Path('output/captions.ass').read_text(); assert 'Dialogue: 1' in s; assert not any('\\\\n' in x for x in s.splitlines() if x.startswith('Dialogue:'))"
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: vice-city-intel-short
          path: output/*
          retention-days: 7
