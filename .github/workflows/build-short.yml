name: Build Vice City Intel Short
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic (optional)"
        required: false
        default: "GTA 6 Unwanted Attention: Sneak Into the Impound"
      gameplay_url:
        description: "Direct HTTPS MP4 URL from a source licensed for reuse (optional)"
        required: false
        default: ""
      scene_times:
        description: 'Six mission-matched timestamps in seconds, comma-separated (optional)'
        required: false
        default: ''
      gameplay_credit:
        description: "Original creator credit for this gameplay (optional)"
        required: false
        default: ""
      script:
        description: "English narration (optional)"
        required: false
        default: "Struggling with Unwanted Attention in GTA 6? At the Hamlet impound, sneak over the fence and use the containers to reach the back lot. Find the red Phoenix attached to a tow truck. Get into the tow truck and unhook the Phoenix. Drive the Phoenix through the gate, lose the police, then respray it at Pay 'n' Spray. Follow Vice City Intel for more mission guides."
permissions:
  contents: read
jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check edge-tts pillow
      - name: Validate Python script
        run: python -m py_compile make_short.py
      - name: Retrieve authorized gameplay
        env:
          GAMEPLAY_URL: ${{ inputs.gameplay_url }}
          GAMEPLAY_CREDIT: ${{ inputs.gameplay_credit }}
        run: |
          mkdir -p assets output
          if [ -n "$GAMEPLAY_URL" ]; then
            python - <<'PY'
          import os,urllib.parse,urllib.request,pathlib
          url=os.environ["GAMEPLAY_URL"]
          parsed=urllib.parse.urlsplit(url)
          if parsed.scheme!="https" or not parsed.hostname or parsed.hostname in ("localhost","127.0.0.1"):
              raise SystemExit("Only direct public HTTPS URLs are accepted")
          req=urllib.request.Request(url,headers={"User-Agent":"ViceCityIntel/1.0"})
          target=pathlib.Path("assets/gameplay.mp4")
          with urllib.request.urlopen(req,timeout=40) as response, target.open("wb") as out:
              if "text/html" in response.headers.get("Content-Type","").lower():
                  raise SystemExit("URL returned a webpage, not an MP4 file")
              total=0
              while True:
                  block=response.read(1024*1024)
                  if not block: break
                  total+=len(block)
                  if total>350*1024*1024: raise SystemExit("Video exceeds 350MB")
                  out.write(block)
          if total<100000: raise SystemExit("Downloaded file too small to be gameplay")
          PY
          fi
          if [ ! -s assets/gameplay.mp4 ]; then
            echo "::error::No licensed gameplay file. Supply a direct downloadable MP4 link via gameplay_url, or add assets/gameplay.mp4. YouTube watch-page links are not direct MP4 links."
            exit 1
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 assets/gameplay.mp4 | grep -q video
          if [ -n "$GAMEPLAY_CREDIT" ]; then
            printf 'Gameplay: %s\n' "$GAMEPLAY_CREDIT" > output/GAMEPLAY_CREDIT.txt
          fi
      - name: Generate narration and video
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          SHORT_SCRIPT: ${{ inputs.script }}
          GAMEPLAY_CREDIT: ${{ inputs.gameplay_credit }}
          SCENE_TIMES: ${{ inputs.scene_times }}
        run: python make_short.py
      - name: Verify MP4 and subtitles
        run: |
          test -s output/vice_city_intel.mp4
          test -s output/captions.ass
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q audio
          python -c "from pathlib import Path; s=Path('output/captions.ass').read_text(); assert 'Dialogue: 1' in s; assert not any('\\\\n' in x for x in s.splitlines() if x.startswith('Dialogue:'))"
      - name: Upload finished MP4 (direct iPhone download)
        uses: actions/upload-artifact@v7
        with:
          path: output/vice_city_intel.mp4
          archive: false
          retention-days: 7
      - name: Upload captions, credits and description
        uses: actions/upload-artifact@v7
        with:
          name: vice-city-intel-metadata
          path: |
            output/captions.ass
            output/youtube.txt
            output/GAMEPLAY_CREDIT.txt
          if-no-files-found: ignore
          retention-days: 7
