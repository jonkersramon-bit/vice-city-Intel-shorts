name: Build Vice City Intel Short
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic (optional)"
        required: false
        default: "GTA 6 Mission Tips: 3 Things to Remember"
      gameplay_url:
        description: "Direct HTTPS MP4 URL from a source licensed for reuse (optional)"
        required: false
        default: ""
      scene_times:
        description: 'Six mission-matched timestamps in seconds, comma-separated (optional)'
        required: false
        default: ''
      reuse_permission_confirmed:
        description: "Confirm that you have checked reuse rights for the gameplay source"
        type: boolean
        required: true
        default: false
      gameplay_credit:
        description: "Original creator credit for this gameplay (optional)"
        required: false
        default: ""
      script:
        description: "English narration (optional)"
        required: false
        default: "Want to get better at GTA 6 missions? First, check the objective before rushing in. Second, watch your surroundings and plan a safe escape route. Third, keep a vehicle ready when the mission turns chaotic. Which mission should Vice City Intel cover next?"
permissions:
  contents: read
jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check edge-tts pillow
      - name: Restore reusable licensed photo library
        uses: actions/cache@v4
        with:
          path: photo_library
          key: vci-photos-${{ runner.os }}-${{ hashFiles('photo_library/**/credits.txt') }}-${{ github.run_id }}
          restore-keys: |
            vci-photos-${{ runner.os }}-
      - name: Validate Python script
        run: python -m py_compile make_short.py
      - name: Generate narration and video
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          SHORT_SCRIPT: ${{ inputs.script }}
          GAMEPLAY_CREDIT: ${{ inputs.gameplay_credit }}
          SCENE_TIMES: ${{ inputs.scene_times }}
          MISSION_MODE: "0"
        run: python make_short.py
      - name: Verify MP4 and subtitles
        run: |
          test -s output/vice_city_intel.mp4
          test -s output/captions.ass
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q audio
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/vice_city_intel.mp4)" = "1080,1920"
          python -c "from pathlib import Path; s=Path('output/captions.ass').read_text(); assert 'Dialogue: 1' in s; assert not any('\\\\n' in x for x in s.splitlines() if x.startswith('Dialogue:'))"
      - name: Upload finished MP4 (direct iPhone download)
        uses: actions/upload-artifact@v7
        with:
          path: output/vice_city_intel.mp4
          archive: false
          retention-days: 7
      - name: Upload captions, credits and description
        uses: actions/upload-artifact@v7
        with:
          name: vice-city-intel-metadata
          path: |
            output/captions.ass
            output/scene_review.jpg
            output/youtube.txt
            output/GAMEPLAY_CREDIT.txt
            output/IMAGE_CREDITS.txt
          if-no-files-found: ignore
          retention-days: 7
