name: Test Vice City Intel rendering
on:
  workflow_dispatch:
  push:
    paths:
      - make_short.py
      - .github/workflows/build-short.yml
      - .github/workflows/test-pipeline.yml
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install edge-tts pillow
      - name: Compile script
        run: python -m py_compile make_short.py
      - name: Generate synthetic moving footage for TEST ONLY
        run: |
          mkdir -p assets
          ffmpeg -y -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30" -t 55 -c:v libx264 -preset ultrafast -pix_fmt yuv420p assets/gameplay.mp4
      - name: Run complete test render
        env:
          SHORT_TOPIC: "Pipeline test - NOT REAL GAMEPLAY"
          SHORT_SCRIPT: "This is a technical test of the Vice City Intel video workflow. It checks video motion, narration, captions, and export. This is not a real gameplay guide."
          SCENE_TIMES: "0,8,16,24,32,40"
          MISSION_MODE: "1"
        run: python make_short.py
      - name: Validate result
        run: |
          test -s output/vice_city_intel.mp4
          test -s output/captions.ass
          test -s output/scene_review.jpg
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 output/vice_city_intel.mp4 | grep -q audio
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("output/vice_city_intel.mp4")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          video=next(s for s in info["streams"] if s["codec_type"]=="video")
          audio=next(s for s in info["streams"] if s["codec_type"]=="audio")
          duration=float(info["format"]["duration"])
          assert (video["width"],video["height"])==(720,1280), "Incorrect Shorts dimensions"
          assert 5<=duration<=60, f"Invalid video length: {duration}"
          assert abs(float(audio.get("duration",duration))-duration)<1.5, "Narration/video length mismatch"
          captions=Path("output/captions.ass").read_text(encoding="utf-8")
          assert captions.count("Dialogue: 1,")>=2, "Missing timed captions"
          assert "VICE CITY INTEL" in captions, "Missing channel branding"
          print(f"Verified: 720x1280, {duration:.2f}s, audio and timed captions")
          PY
      - name: Upload test storyboard only
        uses: actions/upload-artifact@v7
        with:
          path: output/scene_review.jpg
          archive: false
          retention-days: 2
